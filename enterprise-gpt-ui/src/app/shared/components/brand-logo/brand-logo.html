<!-- Callers size the host; `h-auto` keeps the aspect ratio while width/height reserve layout. -->
<img
  class="theme-light-only mw-100 h-auto"
  [src]="lightSrc()"
  [alt]="alt()"
  [width]="width()"
  [height]="height()"
  decoding="async"
/>
<img
  class="theme-dark-only mw-100 h-auto"
  [src]="darkSrc()"
  [alt]="alt()"
  [width]="width()"
  [height]="height()"
  decoding="async"
  loading="lazy"
/>
