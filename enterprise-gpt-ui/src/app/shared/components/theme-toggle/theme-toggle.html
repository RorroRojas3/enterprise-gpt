<button
  type="button"
  class="btn btn-ghost btn-icon"
  [attr.aria-label]="label()"
  [attr.title]="label()"
  (click)="toggle()"
>
  <!-- Both icons stay in the DOM; the theme token decides which one has a box. -->
  <app-icon class="theme-light-only" name="bi-moon" />
  <app-icon class="theme-dark-only" name="bi-sun" />
</button>
