@if (illustration() === 'ridgeline') {
  <app-ridgeline variant="empty" />
}

<p
  class="font-display fs-6 fw-semibold mt-1 mb-0"
  role="heading"
  [attr.aria-level]="headingLevel()"
>
  {{ heading() }}
</p>

@if (message()) {
  <p class="small text-body-secondary mb-0">{{ message() }}</p>
}

<div class="d-empty-none">
  <ng-content select="[emptyStateAction]" />
</div>
