<nav [attr.aria-label]="ariaLabel()">
  <!-- `p-1` leaves room for the focus ring, which the scroll container would otherwise clip. -->
  <ul class="pill-subnav nav nav-pills flex-nowrap gap-2 overflow-x-auto p-1 small">
    @for (item of items(); track item.id) {
      <li class="nav-item">
        <a
          class="nav-link d-flex align-items-center rounded-pill fw-semibold text-nowrap touch-target"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLink]="item.link"
        >
          {{ item.label }}
          @if (item.count !== undefined && item.count !== null) {
            <!-- A smaller run beside the label, as on the wide strip, not a badge. -->
            <span class="small ms-1">{{ item.count }}</span>
          }
        </a>
      </li>
    }
  </ul>
</nav>
