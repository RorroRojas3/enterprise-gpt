<!--
  As in modal.html: the click handler detects a press on the ::backdrop, which reports
  the <dialog> itself as its target. Escape is the keyboard path, through the native
  `cancel` event.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  class="offcanvas-panel"
  [class.offcanvas-panel--start]="side() === 'start'"
  [class.offcanvas-panel--bare]="bare()"
  [style.--offcanvas-width]="width()"
  [attr.aria-labelledby]="headingId"
  [attr.aria-busy]="busy() ? 'true' : null"
  (cancel)="onCancel($event)"
  (close)="onClose()"
  (click)="onBackdropClick($event)"
>
  <div class="offcanvas-panel__inner">
    <h2 class="offcanvas-panel__heading" [id]="headingId" tabindex="-1">{{ heading() }}</h2>

    <div class="offcanvas-panel__body">
      <ng-content />
    </div>

    <div class="offcanvas-panel__footer">
      <ng-content select="[offcanvasFooter]" />
    </div>
  </div>
</dialog>
