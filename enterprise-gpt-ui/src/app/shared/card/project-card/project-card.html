<article class="project-card" [attr.aria-labelledby]="headingId" [attr.aria-busy]="pending()">
  <div class="project-card__head">
    <!-- Grouped rather than a third child of the head, so `space-between` still puts the
         actions at the far edge and the link's hit area stays the name itself. -->
    <div class="project-card__identity">
      <app-icon class="project-card__glyph" name="bi-folder-fill" />
      <a class="project-card__name" [id]="headingId" [routerLink]="link()">{{ name() }}</a>
    </div>

    <div class="project-card__actions">
      @if (showFavorite()) {
        <button
          class="project-card__favorite"
          type="button"
          [class.project-card__favorite--on]="favorite()"
          [attr.aria-label]="favoriteLabel()"
          [attr.aria-disabled]="pending() ? 'true' : null"
          (click)="favoriteToggled.emit()"
        >
          <app-icon [name]="favorite() ? 'bi-star-fill' : 'bi-star'" />
        </button>
      }

      <ng-content select="[cardMenu]" />
    </div>
  </div>

  <!-- Reserved height, so a card with no description does not shorten its row. -->
  <p class="project-card__description">{{ description() }}</p>

  <p class="project-card__meta">Updated {{ updatedLabel() }}</p>
</article>
