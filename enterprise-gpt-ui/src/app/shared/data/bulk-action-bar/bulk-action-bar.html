<!--
  Always mounted: a live region inserted with its text in place is not announced, so inside
  the @if below the 0 → 1 change would be silent.
-->
<p class="visually-hidden" aria-live="polite">{{ count() > 0 ? summary() : '' }}</p>

@if (count() > 0) {
  <div class="bulk-bar" role="region" aria-label="Bulk actions">
    <p class="bulk-bar__count">{{ summary() }}</p>

    @if (note()) {
      <p class="bulk-bar__note">{{ note() }}</p>
    }

    <div class="bulk-bar__actions"><ng-content /></div>

    <button class="bulk-bar__clear" type="button" (click)="cleared.emit()">Clear</button>
  </div>
}
