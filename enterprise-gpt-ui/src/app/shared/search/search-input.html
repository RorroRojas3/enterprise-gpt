<label class="visually-hidden" [for]="inputId">{{ label() }}</label>

<div class="position-relative">
  <app-icon
    class="position-absolute top-50 start-0 translate-middle-y ms-3 pe-none text-body-secondary small"
    name="bi-search"
  />

  <input
    #field
    class="form-control ps-5 bg-surface"
    type="search"
    autocomplete="off"
    [id]="inputId"
    [placeholder]="placeholder()"
    [value]="text()"
    [attr.aria-busy]="busy() ? 'true' : null"
    (input)="onInput($event)"
    (keydown.escape)="onEscape()"
  />
</div>
