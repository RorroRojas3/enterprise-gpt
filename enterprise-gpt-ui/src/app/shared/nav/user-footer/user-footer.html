<!-- Hidden: the initials restate the name beside them, which would be read twice. -->
<span class="user-footer__avatar" aria-hidden="true">{{ initials() }}</span>

<!-- The compact strip carries the name off-screen rather than dropping it. -->
@if (compact()) {
  <span class="visually-hidden">Signed in as {{ session.displayName() }}</span>
} @else {
  <span class="user-footer__name">{{ session.displayName() }}</span>
}

<app-theme-toggle />

<button
  class="user-footer__action"
  type="button"
  [disabled]="signingOut()"
  aria-label="Sign out"
  title="Sign out"
  (click)="signOut()"
>
  <app-icon name="bi-box-arrow-right" />
</button>
