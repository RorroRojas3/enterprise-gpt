<app-menu
  class="min-w-0"
  [label]="menuLabel()"
  align="start"
  direction="up"
  [panelWidth]="360"
  [stayOpen]="models.error() !== null && settings.selectedModel() === null"
>
  <!-- Below md the pill gives up everything but the name, which says which model will answer. -->
  <span
    appMenuTriggerContent
    class="d-inline-flex align-items-center gap-2 min-w-0 rounded-pill bg-body-tertiary px-2 px-md-3 py-1 small fw-semibold text-nowrap"
  >
    <app-status-dot [tone]="pillTone()" label="" [labelHidden]="true" [size]="7" />
    <span class="text-truncate">{{ pillName() }}</span>
    @if (pillContext(); as context) {
      <span class="d-none d-md-inline font-monospace small fw-normal text-body-secondary">{{
        context
      }}</span>
    }
    <app-icon class="small text-body-secondary" name="bi-chevron-down" />
  </span>

  <!--
    Disabled menu items, not <p>: role="menu" allows only menuitem children, and an empty menu
    fails axe and strands the roving focus.
  -->
  @if (models.error() !== null && settings.selectedModel() === null) {
    <button appMenuItem type="button" aria-disabled="true" class="small">
      The model catalog failed to load.
    </button>
    <button appMenuItem type="button" (click)="models.reload()">
      <app-icon name="bi-arrow-clockwise" />
      Retry
    </button>
  } @else if (models.models().length === 0) {
    <button appMenuItem type="button" aria-disabled="true" class="small">
      {{ models.isFulfilled() ? 'No models are available.' : 'Loading models…' }}
    </button>
  } @else {
    @for (model of models.models(); track model.id) {
      <!-- Two-line rows: the dot tops out beside the first line and the check centres itself. -->
      <button
        appMenuItem
        type="button"
        role="menuitemradio"
        class="align-items-start"
        [attr.aria-checked]="isSelected(model)"
        [class.bg-body-tertiary]="isSelected(model)"
        (click)="settings.selectModel(model.id)"
      >
        <app-status-dot
          class="mt-1"
          [tone]="toneOf(model)"
          label=""
          [labelHidden]="true"
          [size]="8"
        />
        <span class="d-flex flex-column flex-fill gap-1 min-w-0">
          <span class="d-flex align-items-center gap-2 small fw-semibold">
            {{ model.name }}
            @if (model.isDefault) {
              <span class="badge rounded-pill bg-info-subtle text-info-emphasis text-uppercase"
                >Default</span
              >
            }
          </span>
          <span class="small text-body-secondary"
            ><span>{{ captionPrefix(model) }}</span
            ><span class="font-monospace">{{ contextOf(model) }}</span
            ><span>{{ captionSuffix(model) }}</span></span
          >
        </span>
        @if (isSelected(model)) {
          <app-icon class="align-self-center text-primary" name="bi-check-lg" />
        }
      </button>
    }
  }
</app-menu>
