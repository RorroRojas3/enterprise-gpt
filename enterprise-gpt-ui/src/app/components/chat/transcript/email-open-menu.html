<a
  [class]="openClass()"
  [attr.aria-label]="openLabel()"
  [href]="mailtoUrl()"
  (click)="onOpenDefault()"
>
  <app-brand-icon name="brand-outlook" />
  Open Email
</a>

<!-- `stayOpen` is off: every row leaves for somewhere else. -->
<app-menu icon="bi-chevron-down" [label]="menuLabel()" [panelWidth]="232" [(open)]="menuOpen">
  <a appMenuItem target="_blank" rel="noopener" [href]="outlookWebUrl()">
    <app-brand-icon name="brand-outlook" />
    Outlook on the web
  </a>
  <button appMenuItem type="button" (click)="onCopy()">
    <app-icon name="bi-copy" />
    Copy email
  </button>
</app-menu>
