<!-- Not a live region: the Transcript's persistent status region announces
     abnormal endings, because a region created with its content is unreliable. -->
<div [class]="frameClass()">
  <div
    class="d-flex align-items-center gap-2 small"
    [class.flex-fill]="isRow()"
    [class.min-w-0]="isRow()"
  >
    <app-icon class="flex-shrink-0" [class]="iconClass()" [name]="view().icon" />
    <span [class]="titleClass()">{{ view().title }}</span>
  </div>

  @if (view().body; as body) {
    <p class="small ms-4 mt-2 mb-0" [class]="mutedClass()">{{ body }}</p>
  }
  @if (view().trace; as trace) {
    <p class="small font-monospace ms-4 mt-1 mb-0" [class]="mutedClass()">{{ trace }}</p>
  }

  @if (retryable()) {
    <div [class]="actionsClass()">
      <button
        #retry
        type="button"
        class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
        (click)="retried.emit()"
      >
        @if (!isRow()) {
          <app-icon name="bi-arrow-clockwise" />
        }
        Retry
      </button>
    </div>
  }
</div>
