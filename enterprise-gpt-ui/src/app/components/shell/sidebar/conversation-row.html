<!--
  Two RouterLinkActive instances: the wrapper paints the row, the anchor carries aria-current.
  The kebab is the anchor's sibling, as interactive content inside an <a> is invalid.
-->
<div class="row" routerLinkActive="row--selected" [routerLinkActiveOptions]="exact">
  <a
    class="row__link"
    [routerLink]="link()"
    routerLinkActive
    [routerLinkActiveOptions]="exact"
    ariaCurrentWhenActive="page"
  >
    <span class="row__title">{{ conversation().name }}</span>

    <!--
      Labelled: the star is the only thing marking a favourite. Display-only, since a button
      inside the <a> would be invalid; the kebab carries the toggle.
    -->
    @if (conversation().isFavorite) {
      <app-icon class="row__star" name="bi-star-fill" label="Favourite" />
    }
  </a>

  <app-menu class="row__menu" [label]="'Actions for ' + conversation().name">
    <!--
      aria-disabled: native disabled breaks the panel's roving focus. The store's begin* guards
      make the click a no-op while pending.
    -->
    <button
      appMenuItem
      type="button"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="actions.beginRename(conversation())"
    >
      <app-icon name="bi-pencil" />
      Rename
    </button>
    <button
      appMenuItem
      type="button"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="actions.toggleFavorite(conversation())"
    >
      <app-icon [name]="conversation().isFavorite ? 'bi-star-fill' : 'bi-star'" />
      {{ conversation().isFavorite ? 'Unfavourite' : 'Favourite' }}
    </button>
    <!-- The chevron is visual only: what opens is a dialog, as aria-haspopup announces. -->
    <button
      appMenuItem
      type="button"
      aria-haspopup="dialog"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="openPicker()"
    >
      <app-icon name="bi-folder-symlink" />
      <span class="row__menu-label">Move to project</span>
      <app-icon class="row__menu-chevron" name="bi-chevron-right" />
    </button>
    <!-- Absent, not inert, when there is no project to leave; the picker offers it too. -->
    @if (conversation().projectId !== null) {
      <button
        appMenuItem
        type="button"
        [attr.aria-disabled]="pending() ? 'true' : null"
        (click)="actions.moveToProject(conversation(), null)"
      >
        <app-icon name="bi-folder-minus" />
        Remove from project
      </button>
    }
    <hr appMenuSeparator />
    <button
      appMenuItem
      type="button"
      class="menu__item--danger"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="actions.beginDelete(conversation())"
    >
      <app-icon name="bi-trash3" />
      Delete
    </button>
  </app-menu>

  <!-- Mounted only while open, so no closed row carries a panel it never shows. -->
  @if (pickerOpen() && pickerAnchor(); as anchor) {
    <app-project-picker [conversation]="conversation()" [anchor]="anchor" [(open)]="pickerOpen" />
  }
</div>
