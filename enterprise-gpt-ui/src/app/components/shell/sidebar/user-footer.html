<!-- Hidden: the initials restate the name beside them, which would be read twice. -->
<span class="avatar-circle text-bg-primary small fw-semibold" aria-hidden="true">{{
  initials()
}}</span>

<!-- The compact strip carries the name off-screen rather than dropping it. -->
@if (compact()) {
  <span class="visually-hidden">Signed in as {{ session.displayName() }}</span>
} @else {
  <span class="text-truncate small fw-semibold flex-grow-1">{{ session.displayName() }}</span>
}

<app-theme-toggle />

<button
  class="btn btn-ghost btn-icon"
  type="button"
  [disabled]="signingOut()"
  aria-label="Sign out"
  title="Sign out"
  (click)="signOut()"
>
  <app-icon name="bi-box-arrow-right" />
</button>
