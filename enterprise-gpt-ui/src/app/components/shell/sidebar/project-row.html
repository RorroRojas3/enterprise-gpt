<div class="project" routerLinkActive="project--selected">
  <a class="project__link" [routerLink]="link()" routerLinkActive ariaCurrentWhenActive="page">
    <app-icon class="project__glyph" name="bi-folder-fill" />
    <span class="project__title">{{ project().name }}</span>
  </a>

  <button
    class="project__disclosure"
    type="button"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="expanded() ? panelId() : null"
    [attr.aria-label]="disclosureLabel()"
    (click)="toggle()"
  >
    <app-icon [name]="expanded() ? 'bi-chevron-down' : 'bi-chevron-right'" />
  </button>

  <!-- Always Unfavourite: every row in this section is starred by construction. -->
  <app-menu class="project__menu" [label]="'Actions for ' + project().name">
    <!--
      `aria-disabled`: native `disabled` breaks the panel's roving focus. The store's guards
      make the click a no-op while pending.
    -->
    <button
      appMenuItem
      type="button"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="unfavorited.emit()"
    >
      <app-icon name="bi-star" />
      Unfavourite
    </button>
    <button
      appMenuItem
      type="button"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="actions.beginEdit(project())"
    >
      <app-icon name="bi-pencil" />
      Rename
    </button>
    <hr appMenuSeparator />
    <button
      appMenuItem
      type="button"
      class="menu__item--danger"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="deleted.emit()"
    >
      <app-icon name="bi-trash3" />
      Delete
    </button>
  </app-menu>
</div>

@if (expanded()) {
  <!-- The host's own `id` property, not an input: the disclosure's aria-controls target. -->
  <app-sidebar-project-conversations
    [id]="panelId()"
    [projectId]="project().id"
    [projectName]="project().name"
  />
}
