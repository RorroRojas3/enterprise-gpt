<app-modal heading="Delete project?" size="sm" [open]="open()" (closed)="onClosed()">
  @if (actions.deleteTarget(); as target) {
    <p class="small text-body-secondary mb-0">
      “{{ target.name }}” and its files will be permanently deleted. Its conversations are kept and
      move out of the project.
    </p>
  }

  <!-- Autofocus on Cancel, never Delete, so a stray Enter on opening destroys nothing. -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    data-modal-autofocus
    (click)="actions.cancelDelete()"
  >
    Cancel
  </button>
  <button modalFooter class="btn btn-danger" type="button" (click)="confirm()">Delete</button>
</app-modal>
