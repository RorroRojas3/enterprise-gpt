<app-modal
  heading="Rename conversation"
  size="sm"
  [open]="open()"
  [busy]="actions.renameBusy()"
  (closed)="actions.cancelRename()"
>
  <!-- `novalidate`: the schema owns validation; the native bubble would fight the inline error. -->
  <form id="rename-conversation-form" novalidate (submit)="submit($event)">
    <label class="form-label" for="rename-conversation-name">Name</label>
    <!-- No literal `maxlength` (NG8022): `[formField]` derives it from the schema. -->
    <input
      id="rename-conversation-name"
      class="form-control"
      type="text"
      data-modal-autofocus
      [formField]="f.name"
      [class.is-invalid]="showErrors()"
      [attr.aria-describedby]="
        'rename-conversation-counter' + (showErrorRegion() ? ' rename-conversation-errors' : '')
      "
    />

    <div class="rename__meta">
      @if (showErrorRegion()) {
        <!--
          `role="alert"`: inserted with its content, so a rejection is announced while focus stays
          put. Tracked by `$index` because two rules can emit identical text.
        -->
        <div class="rename__errors" id="rename-conversation-errors" role="alert">
          @if (showErrors()) {
            @for (message of errorMessages(); track $index) {
              <p class="rename__error">{{ message }}</p>
            }
          }
          @for (message of unmatched(); track $index) {
            <p class="rename__error">{{ message }}</p>
          }
        </div>
      }
      <p class="rename__counter font-mono" id="rename-conversation-counter">
        {{ charCount() }} / {{ nameMaxLength }}
      </p>
    </div>
  </form>

  <!-- `modalFooter` on each button, never a wrapper, which would collapse the footer row's gap. -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    [disabled]="actions.renameBusy()"
    (click)="actions.cancelRename()"
  >
    Cancel
  </button>
  <!-- Projected outside the `<form>`, so the `form` attribute ties it back for Enter to submit. -->
  <button
    modalFooter
    class="btn btn-primary"
    type="submit"
    form="rename-conversation-form"
    [disabled]="!canSubmit()"
  >
    Rename
  </button>
</app-modal>
