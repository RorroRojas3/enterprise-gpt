<div class="btn-group" role="group" aria-label="Reporting period">
  @for (range of ranges; track range) {
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary touch-target"
      [class.active]="range === value()"
      [attr.aria-pressed]="range === value()"
      (click)="onSelect(range)"
    >
      {{ range }} days
    </button>
  }
</div>
