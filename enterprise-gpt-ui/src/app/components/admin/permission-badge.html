<span
  class="permission-badge badge rounded-pill bg-body-secondary text-primary border text-truncate mw-100"
  [title]="name()"
>
  @if (managedBy()) {
    <app-icon class="me-1" name="bi-lock" />
  }
  {{ name() }}
  @if (managedBy()) {
    <span class="visually-hidden">— managed by {{ managedBy() }}</span>
  }
</span>
