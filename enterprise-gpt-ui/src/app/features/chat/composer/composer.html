<!--
  The drop target wraps the whole card, not just the textarea: frame `2a` draws the
  overlay at `inset: 4px` of the prompt box, and a zone the size of the visible box is
  the one a user aims at. Bound to the permission, so without `Upload File` the card
  binds no listeners at all and a drop does nothing (US-204, frame `2h`) — and to the
  same in-flight condition as the paperclip, so a drop cannot do what a click cannot.
-->
<div
  class="composer"
  [class.composer--streaming]="turn.inFlight()"
  [appFileDropTarget]="session.canUploadFiles() && !turn.inFlight()"
  (filesDropped)="onFilesChosen($event)"
  #drop="appFileDropTarget"
>
  @if (drop.isDragOver()) {
    <app-drop-overlay />
  }

  <!--
    A chip appearing is otherwise announced to nobody: each chip's own `role="status"`
    is inserted together with its content, which is not reliably read out. This region
    exists from first render and carries a summary rather than per-file progress, so it
    does not re-read on every percentage.
  -->
  <p class="visually-hidden" role="status">{{ uploads.attachmentSummary() }}</p>

  @if (uploads.hasAttachments()) {
    <!-- `role="list"` because `list-style: none` strips list semantics in Safari,
         which is exactly what makes the count announceable. -->
    <ul class="composer__chips" role="list" aria-label="Attached files">
      @for (attachment of uploads.attachments(); track attachment.id) {
        <li>
          <app-attachment-chip
            [attachment]="attachment"
            [removeAction]="attachment.removeAction"
            [downloadable]="attachment.downloadable"
            [downloading]="attachment.downloading"
            (removed)="uploads.remove($event)"
            (retried)="uploads.retry($event)"
            (downloaded)="uploads.download($event)"
          />
        </li>
      }
    </ul>
  }

  <textarea
    #promptBox
    class="composer__prompt"
    rows="2"
    aria-label="Message Enterprise GPT"
    placeholder="Message Enterprise GPT…"
    [value]="prompt()"
    (input)="onPromptInput($event)"
  ></textarea>

  <!--
    The live region exists from first render and the @if toggles its content:
    a region created together with its content is not reliably announced.
  -->
  <p class="composer__note" [class.composer__note--visible]="note() !== null" role="status">
    @if (note(); as note) {
      <app-icon name="bi-exclamation-triangle-fill" />
      {{ note }}
    }
  </p>

  <div class="composer__controls">
    @if (session.canUploadFiles()) {
      <!-- Absent rather than disabled without the grant, which is why this is an
           `@if` and not a `[disabled]` — frame `2h`. -->
      <button
        type="button"
        class="composer__aux composer__icon-button"
        aria-label="Attach files"
        [disabled]="turn.inFlight()"
        (click)="openFilePicker()"
      >
        <app-icon name="bi-paperclip" />
      </button>
      <!--
        Off-screen rather than `display: none`: a hidden input is not focusable, and
        the button above is the accessible control that opens it. `accept` narrows the
        picker to what this deployment can actually read, and is empty — meaning "any
        file" — until that list loads, because refusing everything on a failed side
        request would be worse than the round trip it saves.
      -->
      <input
        #filePicker
        class="composer__file-input"
        type="file"
        multiple
        tabindex="-1"
        aria-hidden="true"
        [attr.accept]="extensions.accept() || null"
        (change)="onFileInputChange($event)"
      />
    }

    <app-model-menu />
    <app-tools-menu />

    @if (dictation.supported()) {
      <!-- Frame 2i draws the recording pill in the microphone's place, and one
           persistent button morphs into it for the same reason the send control
           morphs into Stop: swapping elements would destroy the control the user
           just pressed and drop focus to <body>. The changing aria-label is also
           what announces the state change on the still-focused button.
           Stop stays operable while a turn streams — only starting is blocked. -->
      <button
        type="button"
        [class.composer__aux]="!dictation.recording()"
        [class.composer__icon-button]="!dictation.recording()"
        [class.composer__mic-pill]="dictation.recording()"
        [attr.aria-label]="dictation.recording() ? 'Stop dictating' : 'Dictate'"
        [disabled]="!dictation.recording() && turn.inFlight()"
        (click)="dictation.toggle()"
      >
        @if (dictation.recording()) {
          <app-icon name="bi-mic-fill" />
          <span class="composer__mic-elapsed font-mono">{{ dictation.elapsedLabel() }}</span>
        } @else {
          <app-icon name="bi-mic" />
        }
      </button>
    }

    <span class="composer__spacer"></span>
    <!-- One persistent button morphs between Send and Stop (frames 1b/2g):
         swapping elements with @if would destroy the control mid-press and
         drop keyboard focus to <body> on the app's primary interaction. -->
    <button
      #actionButton
      type="button"
      class="composer__action btn"
      [class.btn-primary]="!turn.inFlight()"
      [class.composer__send]="!turn.inFlight()"
      [class.composer__stop]="turn.inFlight()"
      [attr.aria-label]="turn.inFlight() ? 'Stop' : 'Send'"
      [disabled]="!turn.inFlight() && sendDisabled()"
      (click)="onAction()"
    >
      @if (turn.inFlight()) {
        <!-- A drawn square in a --brand ring, not a glyph. -->
        <span class="composer__stop-glyph" aria-hidden="true"></span>
      } @else {
        <app-icon name="bi-send-fill" />
      }
    </button>
  </div>
</div>
