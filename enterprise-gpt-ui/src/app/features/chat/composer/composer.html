<div class="composer" [class.composer--streaming]="turn.inFlight()">
  <textarea
    #promptBox
    class="composer__prompt"
    rows="2"
    aria-label="Message Enterprise GPT"
    placeholder="Message Enterprise GPT…"
    [value]="prompt()"
    (input)="onPromptInput($event)"
  ></textarea>

  <!--
    The live region exists from first render and the @if toggles its content:
    a region created together with its content is not reliably announced.
  -->
  <p class="composer__note" [class.composer__note--visible]="note() !== null" role="status">
    @if (note(); as note) {
      <app-icon name="bi-exclamation-triangle-fill" />
      {{ note }}
    }
  </p>

  <div class="composer__controls">
    <app-model-menu />
    <app-tools-menu />

    @if (dictation.supported()) {
      <!-- Frame 2i draws the recording pill in the microphone's place, and one
           persistent button morphs into it for the same reason the send control
           morphs into Stop: swapping elements would destroy the control the user
           just pressed and drop focus to <body>. The changing aria-label is also
           what announces the state change on the still-focused button.
           Stop stays operable while a turn streams — only starting is blocked. -->
      <button
        type="button"
        [class.composer__aux]="!dictation.recording()"
        [class.composer__mic]="!dictation.recording()"
        [class.composer__mic-pill]="dictation.recording()"
        [attr.aria-label]="dictation.recording() ? 'Stop dictating' : 'Dictate'"
        [disabled]="!dictation.recording() && turn.inFlight()"
        (click)="dictation.toggle()"
      >
        @if (dictation.recording()) {
          <app-icon name="bi-mic-fill" />
          <span class="composer__mic-elapsed font-mono">{{ dictation.elapsedLabel() }}</span>
        } @else {
          <app-icon name="bi-mic" />
        }
      </button>
    }

    <span class="composer__spacer"></span>
    <!-- One persistent button morphs between Send and Stop (frames 1b/2g):
         swapping elements with @if would destroy the control mid-press and
         drop keyboard focus to <body> on the app's primary interaction. -->
    <button
      #actionButton
      type="button"
      class="composer__action btn"
      [class.btn-primary]="!turn.inFlight()"
      [class.composer__send]="!turn.inFlight()"
      [class.composer__stop]="turn.inFlight()"
      [attr.aria-label]="turn.inFlight() ? 'Stop' : 'Send'"
      [disabled]="!turn.inFlight() && sendDisabled()"
      (click)="onAction()"
    >
      @if (turn.inFlight()) {
        <!-- A drawn square in a --brand ring, not a glyph. -->
        <span class="composer__stop-glyph" aria-hidden="true"></span>
      } @else {
        <app-icon name="bi-send-fill" />
      }
    </button>
  </div>
</div>
