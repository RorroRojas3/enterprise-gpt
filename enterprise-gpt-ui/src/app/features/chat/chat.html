<!--
  Frame 1b's header bar. Rendered only when a conversation is open: frame 1a has no
  header at all, and an empty 52px rule above the empty state is not the same screen.
-->
@if (conversation.isOpen()) {
  <header class="chat__header">
    <!--
      The skeleton sits *inside* the h1 rather than replacing it: a deep link to a row
      the sidebar has not loaded has no name for the length of a round trip, and
      swapping the heading out would leave the document with no level-1 heading at all
      until it arrives.
    -->
    <h1 class="chat__title">
      @if (conversation.name(); as name) {
        {{ name }}
      } @else {
        <app-skeleton class="chat__title-skeleton" variant="text" width="200px" height="15px" />
      }
    </h1>

    <!--
      US-308: the kebab routes through the same ConversationActionsStore flows as the
      sidebar row — nothing reimplemented. It waits for a full DTO (`current`) because
      rename must echo the fresh projectId and delete names the conversation.
      Deliberately absent until their stories land: the favourite star (US-305), the
      move/remove-project items (US-307), and the sub-768px collapse into frame 1d's
      mobile navbar (US-1403, which builds the responsive shell it collapses into).
    -->
    @if (conversation.current(); as current) {
      <!--
        aria-disabled, never the native attribute: a natively disabled item cannot
        take focus, which strands the menu's roving focus and its Escape handling.
        The store's begin* methods already refuse a pending row, so the click is a
        guarded no-op, not a hole.
      -->
      <app-menu class="chat__menu" [label]="'Actions for ' + current.name">
        <button
          appMenuItem
          type="button"
          [attr.aria-disabled]="conversation.actionPending() ? 'true' : null"
          (click)="actions.beginRename(current)"
        >
          <app-icon name="bi-pencil" />
          Rename
        </button>
        <hr appMenuSeparator />
        <button
          appMenuItem
          type="button"
          class="menu__item--danger"
          [attr.aria-disabled]="conversation.actionPending() ? 'true' : null"
          (click)="actions.beginDelete(current)"
        >
          <app-icon name="bi-trash3" />
          Delete
        </button>
      </app-menu>
    }
  </header>
}

<div class="chat__body">
  @if (conversation.error(); as error) {
    <!--
      A 404 here means the conversation does not exist *or* belongs to someone else —
      the API deliberately does not distinguish the two, and neither does this copy.
    -->
    <app-error-panel
      class="chat__error"
      [error]="error"
      [canRetry]="canRetry(error)"
      heading="This conversation couldn’t be opened"
      (retried)="conversation.retry()"
    />
  } @else {
    <app-chat-empty-state [asPageHeading]="!conversation.isOpen()" />
  }
</div>

<!--
  US-402/403: the composer, on the empty screen and on an open conversation
  alike — but not under a conversation that failed to open, where sending has
  no target.
-->
@if (!conversation.error()) {
  <div class="chat__composer">
    <app-composer />
  </div>
}
