<!-- Not a live region: the Transcript's persistent status region announces the stop. Dashed and
     inset: visually detached from the transcript proper. -->
<div class="border border-dashed rounded-4 p-3 ms-3">
  <div class="d-flex align-items-center gap-2 small fw-semibold text-body-secondary">
    <app-icon class="flex-shrink-0" name="bi-stop-circle" />
    Stopped — not saved to this conversation
  </div>

  @if (text(); as text) {
    <!-- The span hugs its text: under `pre-wrap` an indent would render. -->
    <p class="small text-body-secondary text-break mt-2 mb-0">
      <span style="white-space: pre-wrap">{{ text }}</span>
    </p>
  }

  <div class="d-flex flex-wrap gap-2 mt-2">
    <button
      type="button"
      class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
      (click)="copy()"
    >
      <app-icon name="bi-copy" />
      {{ copied() ? 'Copied' : 'Copy' }}
    </button>
    <button
      type="button"
      class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
      (click)="retried.emit()"
    >
      <app-icon name="bi-arrow-clockwise" />
      Retry
    </button>
  </div>
</div>
