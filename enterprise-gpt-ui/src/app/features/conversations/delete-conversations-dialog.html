<app-modal [heading]="heading()" size="sm" [open]="open()" (closed)="onClosed()">
  <!-- Counted rather than named: the count is what decides whether to go ahead. -->
  <p class="delete-conversations__body">{{ body() }}</p>

  <!-- Autofocus on Cancel, so Enter on a freshly opened destructive confirm destroys nothing. -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    data-modal-autofocus
    (click)="open.set(false)"
  >
    Cancel
  </button>
  <button modalFooter class="btn btn-danger" type="button" (click)="confirm()">
    Delete conversations
  </button>
</app-modal>
