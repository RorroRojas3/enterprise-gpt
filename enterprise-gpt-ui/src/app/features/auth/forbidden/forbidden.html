<app-auth-page>
  <app-icon class="forbidden__icon" name="bi-shield-lock" />

  <h1 #heading class="forbidden__heading font-display" tabindex="-1">
    You don’t have access to Admin
  </h1>

  <p class="forbidden__message">
    This area needs the Administrator permission. If you think you should have it, ask an existing
    administrator.
  </p>

  <a class="btn btn-primary forbidden__action" [routerLink]="chatRoute">Back to Chat</a>
</app-auth-page>
