<app-modal
  [heading]="heading()"
  size="md"
  [open]="open()"
  [busy]="actions.formBusy() || actions.formLoading()"
  (closed)="actions.cancelForm()"
>
  <!-- novalidate: schema rules own validation; the browser's bubble would fight the inline one. -->
  <form id="project-form" novalidate (submit)="submit($event)">
    <div class="mb-3">
      <label class="form-label" for="project-form-name">Name</label>
      <!-- No literal maxlength (NG8022): [formField] derives it from the schema's rule. -->
      <input
        id="project-form-name"
        class="form-control"
        type="text"
        data-modal-autofocus
        [formField]="f.name"
        [appInvalidField]="showNameErrors()"
        [fieldErrorsShown]="showNameRegion()"
        fieldNote="project-form-name-counter"
      />

      <!-- One row, so the counter survives the invalid state beside the errors. -->
      <div class="d-flex justify-content-between gap-3 mt-1">
        @if (showNameRegion()) {
          <!-- role="alert", since focus does not move on submit. track $index: two rules can
               emit identical text. -->
          <div
            class="invalid-feedback d-block min-w-0 mt-0"
            id="project-form-name-errors"
            role="alert"
          >
            @if (showNameErrors()) {
              @for (message of nameErrors(); track $index) {
                <p class="mb-0">{{ message }}</p>
              }
            }
            @for (message of unmatched(); track $index) {
              <p class="mb-0">{{ message }}</p>
            }
          </div>
        }
        <p
          class="font-monospace small text-body-secondary flex-shrink-0 ms-auto mb-0"
          id="project-form-name-counter"
        >
          {{ nameCount() }} / {{ lengths.name }}
        </p>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="project-form-description">Description</label>
      <input
        id="project-form-description"
        class="form-control"
        type="text"
        placeholder="What is this project for?"
        [formField]="f.description"
        [appInvalidField]="descriptionErrors().show"
      />
      <app-field-errors fieldId="project-form-description" [errors]="descriptionErrors()" />
    </div>

    <div>
      <label class="form-label" for="project-form-instructions">
        Instructions <span class="text-body-secondary fw-normal">(optional)</span>
      </label>
      <textarea
        id="project-form-instructions"
        class="form-control"
        rows="3"
        placeholder="Applied to every conversation in this project"
        [formField]="f.instructions"
        [appInvalidField]="instructionsErrors().show"
      ></textarea>
      <app-field-errors fieldId="project-form-instructions" [errors]="instructionsErrors()" />
    </div>
  </form>

  <!-- modalFooter on each button, not a wrapper: the kit's footer is the flex row. -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    [disabled]="actions.formBusy()"
    (click)="actions.cancelForm()"
  >
    Cancel
  </button>
  <!-- Projected outside the <form>, so the `form` attribute ties it back and lets Enter submit. -->
  <button
    modalFooter
    class="btn btn-primary"
    type="submit"
    form="project-form"
    [attr.aria-disabled]="actions.formBusy() || actions.formLoading() ? 'true' : null"
  >
    @if (actions.formBusy()) {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    }
    {{ submitLabel() }}
  </button>
</app-modal>
