<!--
  Frame `Sidebar` lines 41-69: between the nav and the conversation list, separated by a
  rule. The whole section is absent when the user has starred nothing — a heading over
  nothing is a section that reads as broken.
-->
@if (projects.hasFavorites()) {
  <section class="favorites" aria-labelledby="sidebar-favorites-heading">
    <h2 class="favorites__heading">
      <!--
        A real button owning real state, so `aria-expanded` is honest here — unlike on a
        `routerLink`, which announces a state it neither owns nor can guarantee.
      -->
      <button
        #favoritesToggle
        class="favorites__toggle"
        type="button"
        id="sidebar-favorites-heading"
        [attr.aria-expanded]="open()"
        aria-controls="sidebar-favorites-list"
        (click)="open.set(!open())"
      >
        <app-icon
          class="favorites__chevron"
          [name]="open() ? 'bi-chevron-down' : 'bi-chevron-right'"
        />
        <span>Favorite projects</span>
      </button>
    </h2>

    <!--
      Kept in the DOM while shut, so `aria-controls` above keeps naming something real.
    -->
    <ul class="favorites__list" id="sidebar-favorites-list" [hidden]="!open()">
      @for (project of projects.favorites(); track project.id) {
        <li>
          <app-sidebar-project-row
            [project]="project"
            [expanded]="isExpanded(project.id)"
            (expandedChange)="setExpanded(project.id, $event)"
            (unfavorited)="unfavorite(project)"
            (deleted)="remove(project)"
          />
        </li>
      }
    </ul>
  </section>
}
