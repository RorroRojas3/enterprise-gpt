<!--
  Two RouterLinkActive instances on purpose. The wrapper's paints the row surface —
  it tracks the descendant link — while the anchor's own instance carries
  `ariaCurrentWhenActive`, because `aria-current` belongs on the link element, not
  the container. Both are exact, so the visual and announced states stay one fact.

  The kebab is the anchor's *sibling*: an interactive element nested inside an <a>
  is invalid HTML and splits the accessible name.
-->
<div class="row" routerLinkActive="row--selected" [routerLinkActiveOptions]="exact">
  <a
    class="row__link"
    [routerLink]="link()"
    routerLinkActive
    [routerLinkActiveOptions]="exact"
    ariaCurrentWhenActive="page"
  >
    <span class="row__title">{{ conversation().name }}</span>

    <!--
      Labelled rather than decorative: the star is the only thing distinguishing a
      favourited row, so a screen reader has to hear it too. It joins the link's
      accessible name, which reads "<name>, Favourite". Display-only — the toggle is
      the kebab's Favourite item, because a button here would be an interactive
      element inside the <a>, for the same reason the kebab is a sibling.
    -->
    @if (conversation().isFavorite) {
      <app-icon class="row__star" name="bi-star-fill" label="Favourite" />
    }
  </a>

  <!--
    Frame 3a: revealed on hover, focus, and the selected row; always on touch.
    Delete is the only red item.
  -->
  <app-menu class="row__menu" [label]="'Actions for ' + conversation().name">
    <!--
      aria-disabled rather than the native attribute, for the same reason as the
      chat header's kebab: native disabled breaks the panel's roving focus. The
      store's begin* guards make the click a no-op while the row is pending.
    -->
    <button
      appMenuItem
      type="button"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="actions.beginRename(conversation())"
    >
      <app-icon name="bi-pencil" />
      Rename
    </button>
    <button
      appMenuItem
      type="button"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="actions.toggleFavorite(conversation())"
    >
      <app-icon [name]="conversation().isFavorite ? 'bi-star-fill' : 'bi-star'" />
      {{ conversation().isFavorite ? 'Unfavourite' : 'Favourite' }}
    </button>
    <!--
      Frame 3a draws these two between Favourite and the separator. The chevron is the
      board's submenu affordance; the panel it opens is a dialog rather than a nested
      menu, which is what aria-haspopup announces.
    -->
    <button
      appMenuItem
      type="button"
      aria-haspopup="dialog"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="openPicker()"
    >
      <app-icon name="bi-folder-symlink" />
      <span class="row__menu-label">Move to project</span>
      <app-icon class="row__menu-chevron" name="bi-chevron-right" />
    </button>
    <!--
      Absent for a standalone conversation rather than rendered inert: the repo's rule
      for an action with nothing to act on. The picker carries the same action for a
      reader who opens it instead.
    -->
    @if (conversation().projectId !== null) {
      <button
        appMenuItem
        type="button"
        [attr.aria-disabled]="pending() ? 'true' : null"
        (click)="actions.moveToProject(conversation(), null)"
      >
        <app-icon name="bi-folder-minus" />
        Remove from project
      </button>
    }
    <hr appMenuSeparator />
    <button
      appMenuItem
      type="button"
      class="menu__item--danger"
      [attr.aria-disabled]="pending() ? 'true' : null"
      (click)="actions.beginDelete(conversation())"
    >
      <app-icon name="bi-trash3" />
      Delete
    </button>
  </app-menu>

  <!--
    Mounted only while open, so the anchor is read after the menu's view exists and no
    closed row carries a panel component it never shows.
  -->
  @if (pickerOpen() && pickerAnchor(); as anchor) {
    <app-project-picker [conversation]="conversation()" [anchor]="anchor" [(open)]="pickerOpen" />
  }
</div>
