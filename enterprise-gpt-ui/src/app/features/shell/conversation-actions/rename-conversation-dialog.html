<app-modal
  heading="Rename conversation"
  size="sm"
  [open]="open()"
  [busy]="actions.renameBusy()"
  (closed)="actions.cancelRename()"
>
  <!--
    novalidate: the schema rules own validation, and the browser's own required
    bubble would fight the frame 3c inline message.
  -->
  <form id="rename-conversation-form" novalidate (submit)="submit($event)">
    <label class="form-label" for="rename-conversation-name">Name</label>
    <!--
      No literal maxlength: NG8022 — the [formField] directive owns the constraint
      attributes and derives this one from the schema's maxLength rule.
    -->
    <input
      id="rename-conversation-name"
      class="form-control"
      type="text"
      data-modal-autofocus
      [formField]="f.name"
      [class.is-invalid]="showErrors()"
      [attr.aria-describedby]="
        'rename-conversation-counter' + (showErrorRegion() ? ' rename-conversation-errors' : '')
      "
    />

    <!-- Frame 3c: message left in --fail, counter right in JetBrains Mono, one row. -->
    <div class="rename__meta">
      @if (showErrorRegion()) {
        <!--
          role="alert": the region is inserted together with its content, so the
          rejection is announced — without it a screen-reader user presses Rename,
          focus does not move, and the refusal is silent. track $index, not the
          message: two rules can emit identical text.
        -->
        <div class="rename__errors" id="rename-conversation-errors" role="alert">
          @if (showErrors()) {
            @for (message of errorMessages(); track $index) {
              <p class="rename__error">{{ message }}</p>
            }
          }
          @for (message of unmatched(); track $index) {
            <p class="rename__error">{{ message }}</p>
          }
        </div>
      }
      <p class="rename__counter font-mono" id="rename-conversation-counter">
        {{ charCount() }} / {{ nameMaxLength }}
      </p>
    </div>
  </form>

  <!--
    modalFooter on each button, never on a wrapper div: the kit's footer is the flex
    row (frame 3c's right-aligned, gapped pair), and a wrapper would collapse its
    gap to nothing once Angular strips the inter-element whitespace.
  -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    [disabled]="actions.renameBusy()"
    (click)="actions.cancelRename()"
  >
    Cancel
  </button>
  <!--
    Outside the <form> element (the footer projects into the modal's slot), so the
    native `form` attribute is what ties it back — and what makes Enter in the
    input perform this button's submit.
  -->
  <button
    modalFooter
    class="btn btn-primary"
    type="submit"
    form="rename-conversation-form"
    [disabled]="!canSubmit()"
  >
    Rename
  </button>
</app-modal>
