<app-modal
  [heading]="heading()"
  size="md"
  [open]="open()"
  [busy]="actions.formBusy()"
  (closed)="actions.cancelForm()"
>
  <!-- novalidate: the schema owns validation, and the browser bubble would fight it. -->
  <form id="model-form" novalidate (submit)="submit($event)">
    @if (unmatched().length > 0) {
      <!-- Server messages no control carries, which would otherwise be silently dropped. -->
      <div class="alert alert-danger py-2 small" role="alert">
        @for (message of unmatched(); track $index) {
          <p class="mb-0">{{ message }}</p>
        }
      </div>
    }

    <div class="row g-3 small">
      <div class="col-12 col-sm-6">
        <label class="form-label" for="model-form-provider">Provider</label>
        <!-- A client-side mirror of the seeded rows: no endpoint lists providers. -->
        <select
          id="model-form-provider"
          class="form-select"
          data-modal-autofocus
          [formField]="f.providerId"
          [appInvalidField]="providerErrors().show"
        >
          <option value="">Choose a provider…</option>
          @for (provider of providers; track provider.id) {
            <option [value]="provider.id">{{ provider.name }}</option>
          }
        </select>
        <!-- Includes a deactivated provider's 404, shown here rather than as a toast. -->
        <app-field-errors fieldId="model-form-provider" [errors]="providerErrors()" />
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label" for="model-form-name">Display name</label>
        <!-- No literal maxlength: `[formField]` derives it from the schema (NG8022). -->
        <input
          id="model-form-name"
          class="form-control"
          type="text"
          [formField]="f.name"
          [appInvalidField]="fieldErrors().name.show"
        />
        <app-field-errors fieldId="model-form-name" [errors]="fieldErrors().name" />
      </div>

      <div class="col-12">
        <label class="form-label" for="model-form-deployment">Deployment name</label>
        <input
          id="model-form-deployment"
          class="form-control font-monospace"
          type="text"
          autocomplete="off"
          spellcheck="false"
          [formField]="f.deploymentName"
          [appInvalidField]="fieldErrors().deploymentName.show"
        />
        <app-field-errors fieldId="model-form-deployment" [errors]="fieldErrors().deploymentName" />
      </div>

      <div class="col-12">
        <label class="form-label" for="model-form-description">Description</label>
        <input
          id="model-form-description"
          class="form-control"
          type="text"
          [formField]="f.description"
          [appInvalidField]="fieldErrors().description.show"
        />
        <app-field-errors fieldId="model-form-description" [errors]="fieldErrors().description" />
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label" for="model-form-context">Context window</label>
        <!-- Text, not type="number", which returns null for unparseable input and loses it. -->
        <input
          id="model-form-context"
          class="form-control font-monospace"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          [formField]="f.contextWindowSize"
          [appInvalidField]="fieldErrors().contextWindowSize.show"
        />
        <app-field-errors fieldId="model-form-context" [errors]="fieldErrors().contextWindowSize" />
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label" for="model-form-output">Max output tokens</label>
        <input
          id="model-form-output"
          class="form-control font-monospace"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          [formField]="f.maxOutputTokens"
          [appInvalidField]="fieldErrors().maxOutputTokens.show"
        />
        <app-field-errors fieldId="model-form-output" [errors]="fieldErrors().maxOutputTokens" />
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label" for="model-form-input-price">
          Input price <span class="fw-normal text-body-secondary">per million tokens</span>
        </label>
        <input
          id="model-form-input-price"
          class="form-control font-monospace"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="Not priced"
          [formField]="f.inputPricePerMillionTokens"
          [appInvalidField]="fieldErrors().inputPricePerMillionTokens.show"
          fieldNote="model-form-price-note"
        />
        <app-field-errors
          fieldId="model-form-input-price"
          [errors]="fieldErrors().inputPricePerMillionTokens"
        />
      </div>

      <div class="col-12 col-sm-6">
        <label class="form-label" for="model-form-output-price">
          Output price <span class="fw-normal text-body-secondary">per million tokens</span>
        </label>
        <input
          id="model-form-output-price"
          class="form-control font-monospace"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="Not priced"
          [formField]="f.outputPricePerMillionTokens"
          [appInvalidField]="fieldErrors().outputPricePerMillionTokens.show"
          fieldNote="model-form-price-note"
        />
        <app-field-errors
          fieldId="model-form-output-price"
          [errors]="fieldErrors().outputPricePerMillionTokens"
        />
      </div>

      <!-- Blank is unpriced, not free: summing it as zero would understate spend. -->
      <div class="col-12">
        <p class="form-text m-0" id="model-form-price-note">
          Leave a price blank if this deployment has none. Blank means unpriced, which usage reports
          show as unknown rather than as zero.
        </p>
      </div>

      <div class="col-12">
        <div class="form-check form-switch mb-0">
          <input
            id="model-form-tools"
            class="form-check-input"
            type="checkbox"
            role="switch"
            [formField]="f.isToolEnabled"
          />
          <label class="form-check-label fw-semibold" for="model-form-tools">
            Tools enabled
            <span class="d-block form-text mt-0 fw-normal">
              Lets a turn on this model call MCP tool servers.
            </span>
          </label>
        </div>
      </div>

      <div class="col-12">
        <div class="form-check form-switch mb-0">
          <input
            id="model-form-reasoning"
            class="form-check-input"
            type="checkbox"
            role="switch"
            [formField]="f.isReasoningEnabled"
          />
          <label class="form-check-label fw-semibold" for="model-form-reasoning">
            Reasoning enabled
            <span class="d-block form-text mt-0 fw-normal">
              Read only by Azure AI Foundry deployments.
            </span>
          </label>
        </div>
      </div>

      <div class="col-12">
        <div class="form-check form-switch mb-0">
          <input
            id="model-form-selectable"
            class="form-check-input"
            type="checkbox"
            role="switch"
            [formField]="f.isUserSelectable"
          />
          <label class="form-check-label fw-semibold" for="model-form-selectable">
            Visible in model picker
            <!-- Not retiring: a hidden model still serves a turn that names it by id. -->
            <span class="d-block form-text mt-0 fw-normal">
              Turn this off for an internal deployment users should never pick to chat with.
            </span>
          </label>
        </div>
      </div>

      <div class="col-12">
        <div class="form-check form-switch mb-0">
          <input
            id="model-form-default"
            class="form-check-input"
            type="checkbox"
            role="switch"
            [formField]="f.isDefault"
            [appInvalidField]="defaultErrors().show"
          />
          <label class="form-check-label fw-semibold" for="model-form-default">
            Default model
            <span class="d-block form-text mt-0 fw-normal">
              Saving this replaces whichever model is the default today.
            </span>
          </label>
          <!-- `isDefault` has no `fieldErrors()` entry, so Save would otherwise block silently. -->
          <app-field-errors fieldId="model-form-default" [errors]="defaultErrors()" />
        </div>
      </div>
    </div>
  </form>

  <!-- modalFooter on each button: a wrapper would collapse the footer's flex gap. -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    [disabled]="actions.formBusy()"
    (click)="actions.cancelForm()"
  >
    Cancel
  </button>
  <!-- Projected outside the <form>, so the `form` attribute ties it back, Enter included. -->
  <button
    modalFooter
    class="btn btn-primary"
    type="submit"
    form="model-form"
    [attr.aria-disabled]="actions.formBusy() ? 'true' : null"
  >
    @if (actions.formBusy()) {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    }
    {{ submitLabel() }}
  </button>
</app-modal>
