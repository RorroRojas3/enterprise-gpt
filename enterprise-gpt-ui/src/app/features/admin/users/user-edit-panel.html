<app-offcanvas
  heading="Edit user"
  [open]="open()"
  [busy]="actions.formBusy()"
  (closed)="actions.cancelForm()"
>
  @if (target(); as user) {
    <div class="vstack gap-3">
      <!-- In the body, not the header: `Offcanvas` owns its own <h2>. No "last active" line,
           since `UserDto` carries no sign-in timestamp. -->
      <div class="d-flex align-items-center gap-3 min-w-0">
        <app-avatar-initials
          [name]="user.fullName"
          [fallback]="user.email"
          [seed]="user.id"
          [size]="40"
        />
        <div class="min-w-0">
          <p class="mb-0 text-truncate fw-semibold">{{ displayName() }}</p>
          <p class="mb-0 text-truncate small text-body-secondary">{{ user.email }}</p>
        </div>
      </div>

      <!-- The PUT treats `permissionIds` as the complete set, so leaving one unchecked revokes. -->
      <div class="alert alert-warning d-flex gap-2 py-2 mb-0 small">
        <app-icon class="flex-shrink-0 mt-1 text-warning" name="bi-exclamation-triangle-fill" />
        <p class="mb-0">
          <strong>Saving replaces this user’s entire permission set.</strong>
          Unchecking a permission revokes it.
        </p>
      </div>

      <p class="mb-0 small fw-semibold" id="edit-user-permissions">Permissions</p>
      <div role="group" aria-labelledby="edit-user-permissions">
        <app-permission-checklist
          captionStyle="block"
          [permissions]="actions.checklist()"
          [(selectedIds)]="selectedIds"
          [loading]="actions.permissionsLoading()"
          [error]="actions.permissionsError()"
          [disabled]="actions.formBusy()"
          [messageFor]="messageFor"
          [retried]="retryPermissions"
        />
      </div>

      @if (unmatched().length > 0) {
        <div class="alert alert-danger py-2 mb-0 small" role="alert">
          @for (message of unmatched(); track $index) {
            <p class="mb-0">{{ message }}</p>
          }
        </div>
      }
    </div>
  }

  <button
    offcanvasFooter
    class="btn btn-outline-secondary"
    type="button"
    [disabled]="actions.formBusy()"
    (click)="actions.cancelForm()"
  >
    Cancel
  </button>
  <button
    offcanvasFooter
    class="btn btn-primary"
    type="button"
    [disabled]="!canSubmit()"
    (click)="submit()"
  >
    @if (actions.formBusy()) {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    }
    Save changes
  </button>
</app-offcanvas>
