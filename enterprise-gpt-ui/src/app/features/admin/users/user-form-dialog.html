<app-modal
  heading="Add user"
  size="md"
  [open]="open()"
  [busy]="actions.formBusy()"
  (closed)="actions.cancelForm()"
>
  <!--
    novalidate: the schema rules own validation, and the browser's own required bubble
    would fight frame `5b`'s inline message.
  -->
  <form id="user-form" class="user-form" novalidate (submit)="submit($event)">
    <div class="user-form__field">
      <label class="form-label" for="user-form-email">Work email</label>
      <!--
        No literal maxlength: NG8022 — the [formField] directive owns the constraint
        attributes and derives this one from the schema's maxLength rule.
      -->
      <input
        id="user-form-email"
        class="form-control"
        type="email"
        autocomplete="off"
        placeholder="name@andessoftware.com"
        data-modal-autofocus
        [formField]="f.email"
        [class.is-invalid]="showEmailErrors()"
        [attr.aria-describedby]="showErrorRegion() ? 'user-form-email-errors' : null"
      />

      @if (showErrorRegion()) {
        <!--
          role="alert": the region is inserted together with its content, so the rejection
          is announced — without it a screen-reader user presses Add user, focus does not
          move, and the refusal is silent. track $index, not the message: two rules can
          emit identical text.
        -->
        <div class="user-form__errors" id="user-form-email-errors" role="alert">
          @if (showEmailErrors()) {
            @for (message of emailErrors(); track $index) {
              <p class="user-form__error">{{ message }}</p>
            }
          }
          @for (message of unmatched(); track $index) {
            <p class="user-form__error">{{ message }}</p>
          }
        </div>
      }
    </div>

    <div class="user-form__field">
      <p class="form-label" id="user-form-permissions">Permissions</p>
      <!--
        A group label rather than a <label for>: a checklist has no single control to
        point at, and `aria-labelledby` on the group is what names the set.
      -->
      <div role="group" aria-labelledby="user-form-permissions">
        <app-permission-checklist
          [permissions]="actions.checklist()"
          [(selectedIds)]="selectedIds"
          [loading]="actions.permissionsLoading()"
          [error]="actions.permissionsError()"
          [disabled]="actions.formBusy()"
          [retried]="retryPermissions"
        />
      </div>
      <p class="user-form__note">
        Every default permission is granted as well, whether or not it is checked here.
      </p>
    </div>
  </form>

  <!--
    modalFooter on each button, never on a wrapper div: the kit's footer is the flex row,
    and a wrapper would collapse its gap once Angular strips the inter-element whitespace.
  -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    [disabled]="actions.formBusy()"
    (click)="actions.cancelForm()"
  >
    Cancel
  </button>
  <!--
    Outside the <form> element (the footer projects into the modal's slot), so the native
    `form` attribute is what ties it back — and what makes Enter in the field submit.
  -->
  <button
    modalFooter
    class="btn btn-primary"
    type="submit"
    form="user-form"
    [disabled]="!canSubmit()"
  >
    @if (actions.formBusy()) {
      <span class="kit-spinner" aria-hidden="true"></span>
    }
    Add user
  </button>
</app-modal>
