<app-modal
  heading="Add user"
  size="md"
  [open]="open()"
  [busy]="actions.formBusy()"
  (closed)="actions.cancelForm()"
>
  <!-- novalidate: schema rules own validation; the browser's bubble would fight the inline one. -->
  <form id="user-form" class="user-form" novalidate (submit)="submit($event)">
    <div class="user-form__field">
      <label class="form-label" for="user-form-email">Work email</label>
      <!-- No literal maxlength (NG8022): [formField] derives it from the schema's rule. -->
      <input
        id="user-form-email"
        class="form-control"
        type="email"
        autocomplete="off"
        placeholder="name@andessoftware.com"
        data-modal-autofocus
        [formField]="f.email"
        [class.is-invalid]="showEmailErrors()"
        [attr.aria-describedby]="showErrorRegion() ? 'user-form-email-errors' : null"
      />

      @if (showErrorRegion()) {
        <!-- role="alert", since focus does not move on submit. track $index: two rules can
             emit identical text. -->
        <div class="user-form__errors" id="user-form-email-errors" role="alert">
          @if (showEmailErrors()) {
            @for (message of emailErrors(); track $index) {
              <p class="user-form__error">{{ message }}</p>
            }
          }
          @for (message of unmatched(); track $index) {
            <p class="user-form__error">{{ message }}</p>
          }
        </div>
      }
    </div>

    <div class="user-form__field">
      <p class="form-label" id="user-form-permissions">Permissions</p>
      <!-- A group label, not <label for>: a checklist has no single control to point at. -->
      <div role="group" aria-labelledby="user-form-permissions">
        <app-permission-checklist
          [permissions]="actions.checklist()"
          [(selectedIds)]="selectedIds"
          [loading]="actions.permissionsLoading()"
          [error]="actions.permissionsError()"
          [disabled]="actions.formBusy()"
          [retried]="retryPermissions"
        />
      </div>
      <p class="user-form__note">
        Every default permission is granted as well, whether or not it is checked here.
      </p>
    </div>
  </form>

  <!-- modalFooter on each button, not a wrapper: the kit's footer is the flex row. -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    [disabled]="actions.formBusy()"
    (click)="actions.cancelForm()"
  >
    Cancel
  </button>
  <!-- Projected outside the <form>, so the `form` attribute ties it back and lets Enter submit. -->
  <button
    modalFooter
    class="btn btn-primary"
    type="submit"
    form="user-form"
    [disabled]="!canSubmit()"
  >
    @if (actions.formBusy()) {
      <span class="kit-spinner" aria-hidden="true"></span>
    }
    Add user
  </button>
</app-modal>
