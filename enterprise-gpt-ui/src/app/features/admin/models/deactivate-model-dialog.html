<app-modal heading="Delete model" size="sm" [open]="open()" (closed)="actions.cancelDeactivate()">
  <p class="deactivate-model__body">
    <strong>{{ target()?.name }}</strong> is removed from every user’s model picker. It stays on the
    conversations that already used it, and it cannot be brought back from here.
  </p>

  @if (losesDefault()) {
    <!-- Not a caution: the server clears `IsDefault` on the row it retires and promotes
         nothing in its place, so this states what is about to be true. -->
    <p class="deactivate-model__note deactivate-model__note--warn">
      This is the default model. Deleting it leaves the deployment with no default until you set
      another one.
    </p>
  }

  <!--
    modalFooter on each button, never on a wrapper div: the kit's footer is the flex row.
    Cancel takes initial focus so Enter on a fresh destructive confirmation does nothing.
  -->
  <button
    modalFooter
    class="btn btn-outline-secondary"
    type="button"
    data-modal-autofocus
    (click)="actions.cancelDeactivate()"
  >
    Cancel
  </button>
  <button modalFooter class="btn btn-danger" type="button" (click)="actions.confirmDeactivate()">
    Delete model
  </button>
</app-modal>
