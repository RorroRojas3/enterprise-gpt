<div class="eyebrow">{{ label() }}</div>
<div class="fs-4 fw-bold font-display my-1">{{ value() }}</div>

@if (hasDelta()) {
  <p class="d-flex align-items-center gap-1 mb-0 small text-body-secondary">
    @if (!isFlat()) {
      <app-icon [name]="icon()" [class.text-success-emphasis]="isUp()" />
    }
    <span class="fw-semibold text-body">{{ deltaText() }}</span>
    <span>vs. {{ comparison() }}</span>
  </p>
} @else {
  <p class="mb-0 small text-body-secondary">No {{ comparison() }} to compare with</p>
}
