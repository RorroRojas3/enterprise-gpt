@if (conversations.error(); as error) {
  <!-- Replaces the list: the rows on screen belong to the query that failed. -->
  <app-error-panel
    heading="Conversations could not be loaded"
    [headingLevel]="null"
    [error]="error"
    [canRetry]="canRetry(error)"
    (retried)="conversations.retry()"
  />
} @else {
  <app-data-table
    label="Conversations in this project"
    [rows]="conversations.entities()"
    [columns]="columns"
    [trackKey]="trackKey"
    [rowLabel]="rowLabel"
    [loading]="conversations.isFirstLoad()"
    [summary]="conversations.countSummary()"
    [pendingIds]="actions.pendingIds()"
  >
    <ng-template appTableCell="name" [appTableCellFor]="conversations.entities()" let-row>
      <!-- Block, or the truncation is ignored in the mobile card title. -->
      <a
        class="d-block text-truncate fw-medium link-body-emphasis link-underline-opacity-0 link-underline-opacity-100-hover"
        data-row-anchor
        [routerLink]="[chatRoute, row.id]"
      >
        {{ row.name }}
      </a>
    </ng-template>

    <ng-template appTableCell="updated" [appTableCellFor]="conversations.entities()" let-row>
      <span class="small text-body-secondary">{{ updatedLabel(row) }}</span>
    </ng-template>

    <ng-template appTableCell="favorite" [appTableCellFor]="conversations.entities()" let-row>
      <!--
        No `aria-pressed`: the label carries the direction. Not optimistic: this store owns its
        entities, so `ConversationActionsStore` could not roll a flip back.
      -->
      <button
        class="btn btn-ghost btn-icon btn-icon-sm touch-target"
        type="button"
        [class.text-primary]="row.isFavorite"
        [attr.aria-label]="favoriteLabel(row)"
        [attr.aria-disabled]="actions.isRowPending(row.id) ? 'true' : null"
        (click)="actions.toggleFavorite(row)"
      >
        <app-icon [name]="row.isFavorite ? 'bi-star-fill' : 'bi-star'" />
      </button>
    </ng-template>

    <ng-template appTableCell="actions" [appTableCellFor]="conversations.entities()" let-row>
      <app-menu #rowMenu [label]="'Actions for ' + row.name">
        <button
          appMenuItem
          type="button"
          [attr.aria-disabled]="actions.isRowPending(row.id) ? 'true' : null"
          (click)="actions.beginRename(row)"
        >
          <app-icon name="bi-pencil" />
          Rename
        </button>
        <button
          appMenuItem
          type="button"
          [attr.aria-disabled]="actions.isRowPending(row.id) ? 'true' : null"
          (click)="actions.toggleFavorite(row)"
        >
          <app-icon [name]="row.isFavorite ? 'bi-star-fill' : 'bi-star'" />
          {{ row.isFavorite ? 'Unfavourite' : 'Favourite' }}
        </button>
        <button
          appMenuItem
          type="button"
          aria-haspopup="dialog"
          [attr.aria-disabled]="actions.isRowPending(row.id) ? 'true' : null"
          (click)="openPicker(row, rowMenu)"
        >
          <app-icon name="bi-folder-symlink" />
          <span class="flex-grow-1">Move to another project</span>
          <app-icon class="small" name="bi-chevron-right" />
        </button>
        <!-- Always present: every row on this panel is in a project. -->
        <button
          appMenuItem
          type="button"
          [attr.aria-disabled]="actions.isRowPending(row.id) ? 'true' : null"
          (click)="removeFromProject(row)"
        >
          <app-icon name="bi-folder-minus" />
          Remove from project
        </button>
        <hr appMenuSeparator />
        <button
          appMenuItem
          type="button"
          class="text-danger-emphasis"
          [attr.aria-disabled]="actions.isRowPending(row.id) ? 'true' : null"
          (click)="actions.beginDelete(row)"
        >
          <app-icon name="bi-trash3" />
          Delete
        </button>
      </app-menu>
    </ng-template>

    <div tableEmpty>
      <!--
        No projected action: the composer it points at is one Shift+Tab away. Level 2, as the
        header renders the project name as a button, not a heading.
      -->
      <app-empty-state
        heading="No conversations in this project yet"
        [headingLevel]="2"
        message="Send a prompt from the composer above and the conversation will appear here."
      />
    </div>

    <!--
      The `@if` stays inside the projected div: around it, the `tableFooter` attribute would land on
      an `ng-template`, which `DataTable` drops silently.
    -->
    <div tableFooter class="d-flex justify-content-center d-empty-none">
      @if (conversations.hasMore()) {
        <!--
          Mirrors `loadMore`'s guard so a no-op press never looks operable. The label swaps
          because the spinner is aria-hidden.
        -->
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
          [attr.aria-disabled]="
            conversations.loadingMore() || conversations.isPending() ? 'true' : null
          "
          (click)="onLoadMore()"
        >
          @if (conversations.loadingMore()) {
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            Loading…
          } @else {
            Load more
          }
        </button>
      }
    </div>
  </app-data-table>
}

@if (pickerOpen() && pickerRow(); as row) {
  @if (pickerAnchor(); as anchor) {
    <app-project-picker
      [conversation]="row"
      [anchor]="anchor"
      [open]="pickerOpen()"
      (openChange)="onPickerClosed($event)"
    />
  }
}
