<app-auth-page>
  @if (error(); as sessionError) {
    <app-brand-logo variant="mark" style="width: 58px" />

    <app-error-panel
      [error]="sessionError"
      heading="We couldn’t start Enterprise GPT"
      [headingLevel]="1"
      [canRetry]="canRetry()"
      retryLabel="Retry"
      (retried)="retry()"
    />
  }
</app-auth-page>
