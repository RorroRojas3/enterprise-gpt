<app-auth-page>

  <app-ridgeline variant="auth" />

  <span class="spinner-border text-primary" aria-hidden="true"></span>

  <!-- Focused, not live-announced: a region inserted with its text announces nothing. -->

    Finishing up with Microsoft Entra ID
  </p>
</app-auth-page>
