@if (isNarrow()) {
  <app-pill-subnav [items]="pills" ariaLabel="Administration" />
} @else {
  <nav class="admin-rail" aria-label="Administration">
    <p
      class="d-flex align-items-center gap-2 mb-0 px-2 pt-1 pb-3 text-primary fw-bold font-display"
    >
      <app-icon name="bi-shield-lock" />
      Admin
    </p>

    <!-- `small` on the list: `.nav-link` resets its own font size, so a class on the link loses. -->
    <ul class="nav nav-pills nav-pills-subtle flex-column gap-1 small">
      @for (tab of tabs; track tab.id) {
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center gap-2 px-2"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLink]="tab.link"
          >
            <app-icon [name]="tab.icon" />
            {{ tab.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
}

<!-- `min-w-0` lets the table ellipsise instead of widening the row past the viewport. -->
<div class="d-flex flex-column flex-fill min-w-0">
  <router-outlet />
</div>
