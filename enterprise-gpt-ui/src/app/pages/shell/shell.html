<!--
  The click is handled because the router also listens for `hashchange`, so a bare
  `href="#main-content"` would navigate to `/chat#main-content` and re-run the guards. The
  `href` stays for the affordance and middle-click.
-->
<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>

<!-- Below 768px the only way to reach the sidebar. -->
@if (mode() === 'mobile') {
  <app-mobile-navbar (menuRequested)="openOverlay()" />
}

<!-- Declared once and rendered at one outlet: two copies would duplicate the sidebar's nav id
     and its "Primary" landmark. -->
<ng-template #sidebarPanel>
  <app-sidebar
    class="shell__sidebar"
    [mode]="sidebarMode()"
    (toggled)="onSidebarToggled()"
    (searchRequested)="onSearchRequested()"
  />
</ng-template>

@if (mode() !== 'mobile') {
  @if (tabletOverlayOpen()) {
    <!-- Holds the track the floating panel vacated, so `<main>` never reflows. -->
    <div class="shell__rail" aria-hidden="true"></div>

    <!-- Dismisses on `pointerdown`, like every other dismissal in the app. Hidden from AT:
         `<main>` is inert behind it, and Escape is the keyboard path. -->
    <div class="shell__backdrop" aria-hidden="true" (pointerdown)="dismissOverlay()"></div>
  }

  <ng-container [ngTemplateOutlet]="sidebarPanel" />
}

<!--
  tabindex="-1" so the skip link can move focus here. `inert` under the tablet overlay, or the
  covered content would stay reachable by Tab; the mobile drawer's modal dialog inerts the page.
-->
<main
  #main
  id="main-content"
  class="d-flex flex-column flex-grow-1 min-w-0 overflow-hidden focus-inset"
  tabindex="-1"
  [attr.inert]="tabletOverlayOpen() ? '' : null"
>
  <router-outlet />
</main>

<!--
  `Offcanvas`, for one set of focus and dismissal semantics. The content is guarded by `@if`,
  since the dialog is always in the DOM and an unguarded sidebar would be a second copy.
-->
<app-offcanvas
  side="start"
  width="100%"
  heading="Navigation"
  [bare]="true"
  [open]="mobileDrawerOpen()"
  (openChange)="onDrawerOpenChange($event)"
>
  @if (mobileDrawerOpen()) {
    <!-- The shell owns this close control, since the overlay it dismisses is the shell's. -->
    <button
      class="shell__drawer-close btn btn-ghost btn-icon btn-icon-lg bg-body-tertiary position-absolute"
      type="button"
      data-modal-autofocus
      aria-label="Close navigation"
      (click)="onDrawerOpenChange(false)"
    >
      <app-icon name="bi-x-lg" />
    </button>

    <ng-container [ngTemplateOutlet]="sidebarPanel" />
  }
</app-offcanvas>

<!-- Mounted once here: the shell wraps every invoker, and the invoking features may not import
     each other. -->
<app-rename-conversation-dialog />
<app-delete-conversation-dialog />

<!-- Invoked from the sidebar, chat header and composer too; `Shell` outlives every navigation
     while signed in, so form state is never stranded. -->
<app-project-form-dialog />
<app-delete-project-dialog />

<!-- The composer opens this on both the chat and project detail routes. -->
<app-mcp-credential-dialog />
