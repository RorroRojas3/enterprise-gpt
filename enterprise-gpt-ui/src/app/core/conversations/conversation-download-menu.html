<!-- `stayOpen` so the panel survives the click that starts the download. `hint` is visual only;
     `triggerLabel` carries the same reason for assistive technology. -->
<app-menu
  icon="bi-download"
  [label]="triggerLabel()"
  [hint]="disabled() ? 'Available when the response finishes' : null"
  [disabled]="disabled()"
  [direction]="direction()"
  [align]="direction() === 'up' ? 'start' : 'end'"
  [panelWidth]="280"
  [stayOpen]="true"
  [(open)]="open"
>
  @for (option of options; track option.format) {
    @let busy = preparing() === option.format;
    <!-- `aria-disabled`, not native, so roving focus is not stranded; `onChoose` re-checks, and
         the kit dims it. The busy row is neither dimmed nor disabled. `aria-describedby` reads
         out the note, which menu mode would otherwise skip. -->
    <button
      appMenuItem
      type="button"
      [attr.aria-disabled]="exportInFlight() && !busy ? 'true' : null"
      [attr.aria-busy]="busy ? 'true' : null"
      [attr.aria-describedby]="noteId"
      (click)="onChoose(option.format)"
    >
      @if (busy) {
        <span class="spinner-border spinner-border-sm flex-shrink-0" aria-hidden="true"></span>
        Preparing {{ option.label }}…
      } @else {
        <!-- Each glyph has its own colour, which tells the rows apart once the labels wrap. -->
        <app-icon [name]="option.icon" [class]="option.tone" />
        {{ option.label }}
      }
    </button>
  }

  <!-- Not an `appMenuItem`: a note must not become a stop in the panel's roving focus. -->
  <p class="dropdown-item-text small text-body-secondary border-top mt-1 pt-2 mb-0" [id]="noteId">
    The stopped, unsaved answer on screen won’t be included.
  </p>
</app-menu>
