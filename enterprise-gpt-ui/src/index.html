<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enterprise GPT</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Only the two faces on the critical path: Inter 400 carries all body copy, and
      Montserrat 600 is the first heading weight any user sees (the signing-in
      interstitial, then the chat empty state). Every other face is fetched by the
      browser when a rule first needs it. `crossorigin` is required even
      same-origin — fonts are always fetched in CORS mode, and without it the
      browser issues a second, unused request.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/montserrat-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Styles for the startup and fatal shells are inline rather than in
      styles.scss: they have to render when the stylesheet or the bundle never
      loaded, which is the case they exist for.
    -->
    <style>
      /*
        Fallback for the case the theme script below did not run at all. The two
        colour pairs are --bs-body-bg / --bs-body-color per theme, duplicated here
        because no stylesheet has loaded yet; scripts/check-tokens.mjs asserts they
        stay equal to the tokens.
      */
      :root {
        color-scheme: light dark;
        background: #f7fafc;
        color: #16283a;
      }
      :root[data-bs-theme='dark'] {
        background: #0b1f33;
        color: #e6edf4;
      }
      #app-shell[hidden] {
        display: none;
      }
      #app-shell {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 1rem;
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #app-shell .card {
        max-width: 34rem;
        padding: 2rem;
      }
      #app-shell[data-state='failed'] .card {
        border: 1px solid currentColor;
        border-radius: 0.5rem;
      }
      #app-shell h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      #app-shell h1:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
      #app-shell code {
        display: block;
        margin: 0.75rem 0;
        font-size: 0.875rem;
        opacity: 0.75;
        overflow-wrap: anywhere;
      }
      #app-shell button {
        padding: 0.5rem 1rem;
        font: inherit;
        cursor: pointer;
      }
      #app-shell[data-state='starting'] .on-failed,
      #app-shell[data-state='failed'] .on-starting {
        display: none;
      }
      /*
        The fatal shell is deliberately outside the theme system — system fonts, a
        fixed palette, no brand. Now that :root can carry a dark scheme, it has to be
        pinned or a UA-coloured card would follow the theme and contradict the design.
        These are the board's own values.
      */
      #app-shell[data-state='failed'] {
        color-scheme: light;
        background: #f4f5f6;
        color: #1b1f23;
      }
      #app-shell[data-state='failed'] .card {
        background: #fff;
        border-color: #d9dcdf;
      }
      #app-shell[data-state='failed'] button {
        background: #1b1f23;
        color: #fff;
        border: none;
        border-radius: 6px;
      }
    </style>
    <script>
      // Resolves the theme before first paint. It deliberately duplicates
      // ThemeService and _tokens.scss: neither has loaded yet, which is the whole
      // point. scripts/check-tokens.mjs asserts the key and both colours stay in step.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('egpt.theme');
        } catch (e) {
          // Private mode, blocked third-party storage and enterprise policies all
          // throw on access rather than returning null.
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        // Without this the UA paints scrollbars, form controls and the default canvas
        // from `color-scheme: light dark`, which follows the OS — so a user on a light
        // OS with a stored dark preference still gets a light startup shell.
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>

    <!--
      Visible from first paint and removed by main.ts once the app bootstraps.
      Starting hidden would leave a blank page whenever the bundle itself fails to
      load — a hashed-filename mismatch, a CDN miss, a CSP block — because nothing
      would be running to reveal it.
    -->
    <div id="app-shell" data-state="starting">
      <div class="card">
        <h1 tabindex="-1" id="app-shell-heading">Starting Enterprise GPT…</h1>
        <div class="on-failed">
          <!--
            The live region wraps the explanation only. Including the already-
            focused heading would have it read twice, and a live region is no
            place for an interactive control.
          -->
          <div id="app-shell-status">
            <p>The application configuration could not be loaded, so the app has not started.</p>
            <p>
              This is a deployment problem rather than a problem with your account. If it keeps
              happening, contact your administrator and quote the detail below.
            </p>
            <code id="app-shell-detail"></code>
          </div>
          <button type="button" id="app-shell-retry">Try again</button>
        </div>
      </div>
    </div>

    <noscript>
      <p>Enterprise GPT needs JavaScript. Enable it and reload the page.</p>
    </noscript>

    <script>
      // Watchdog for the one failure the application cannot report on its own: the
      // bundle never ran. Cleared by main.ts on either outcome.
      window.__appShellWatchdog = setTimeout(function () {
        var shell = document.getElementById('app-shell');
        if (shell && shell.dataset.state === 'starting') {
          shell.dataset.state = 'failed';
          document.getElementById('app-shell-heading').textContent =
            'Enterprise GPT could not start';
          document.getElementById('app-shell-detail').textContent =
            'The application did not finish loading.';
          document.getElementById('app-shell-retry').onclick = function () {
            location.reload();
          };
        }
      }, 30000);
    </script>
  </body>
</html>
