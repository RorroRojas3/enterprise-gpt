<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enterprise GPT</title>
    <base href="/" />
    <!--
      Without `viewport-fit=cover` every `env(safe-area-inset-*)` is 0px, and the safe-area
      padding of the navbar, composer, transcript and drawer silently does nothing.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Only the critical-path faces: Inter 400 for body copy, Montserrat 600 for the first heading.
      `crossorigin` even same-origin: fonts fetch in CORS mode, or the browser requests twice.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/montserrat-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Inline so the startup and fatal shells render even if no stylesheet or bundle loads. -->
    <style>
      /* Fallback if the theme script never ran; scripts/check-tokens.mjs keeps it in step. */
      :root {
        color-scheme: light dark;
        background: #f7fafc;
        color: #16283a;
      }
      :root[data-bs-theme='dark'] {
        background: #0b1f33;
        color: #e6edf4;
      }
      #app-shell[hidden] {
        display: none;
      }
      #app-shell {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 1rem;
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #app-shell .app-shell__card {
        max-width: 34rem;
        padding: 2rem;
      }
      #app-shell[data-state='failed'] .app-shell__card {
        border: 1px solid currentColor;
        border-radius: 0.5rem;
      }
      #app-shell h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      #app-shell h1:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
      #app-shell code {
        display: block;
        margin: 0.75rem 0;
        font-size: 0.875rem;
        opacity: 0.75;
        overflow-wrap: anywhere;
      }
      #app-shell button {
        padding: 0.5rem 1rem;
        font: inherit;
        cursor: pointer;
      }
      #app-shell[data-state='starting'] .on-failed,
      #app-shell[data-state='failed'] .on-starting {
        display: none;
      }
      /* The fatal shell sits outside the theme system, so it is pinned light. */
      #app-shell[data-state='failed'] {
        color-scheme: light;
        background: #f4f5f6;
        color: #1b1f23;
      }
      #app-shell[data-state='failed'] .app-shell__card {
        background: #fff;
        border-color: #d9dcdf;
      }
      #app-shell[data-state='failed'] button {
        background: #1b1f23;
        color: #fff;
        border: none;
        border-radius: 6px;
      }
    </style>
    <script>
      // Resolves the theme before first paint, ahead of ThemeService and _tokens.scss.
      // scripts/check-tokens.mjs keeps the storage key and both colours in step.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('egpt.theme');
        } catch (e) {
          // Private mode and storage policies throw on access rather than return null.
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        // Otherwise UA scrollbars and controls follow the OS, not the stored theme.
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>

    <!--
      Visible from first paint; main.ts removes it. Starting hidden would leave a blank page when
      the bundle fails to load, since nothing would run to reveal it.
    -->
    <div id="app-shell" data-state="starting">
      <div class="app-shell__card">
        <h1 tabindex="-1" id="app-shell-heading">Starting Enterprise GPT…</h1>
        <div class="on-failed">
          <!--
            The live region wraps the explanation only: the focused heading would be read twice,
            and a live region is no place for an interactive control.
          -->
          <div id="app-shell-status">
            <p>The application configuration could not be loaded, so the app has not started.</p>
            <p>
              This is a deployment problem rather than a problem with your account. If it keeps
              happening, contact your administrator and quote the detail below.
            </p>
            <code id="app-shell-detail"></code>
          </div>
          <button type="button" id="app-shell-retry">Try again</button>
        </div>
      </div>
    </div>

    <noscript>
      <p>Enterprise GPT needs JavaScript. Enable it and reload the page.</p>
    </noscript>

    <script>
      // Watchdog for a bundle that never ran. 60s: the shell also covers sign-in and the session
      // bootstrap, which a cold API can stretch to tens of seconds.
      window.__appShellWatchdog = setTimeout(function () {
        var shell = document.getElementById('app-shell');
        if (shell && shell.dataset.state === 'starting') {
          shell.dataset.state = 'failed';
          document.getElementById('app-shell-heading').textContent =
            'Enterprise GPT could not start';
          document.getElementById('app-shell-detail').textContent =
            'The application did not finish loading.';
          document.getElementById('app-shell-retry').onclick = function () {
            location.reload();
          };
        }
      }, 60000);
    </script>
  </body>
</html>
