<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <style>
      /* The custom properties below are written by HtmlExportRenderer from ExportTheme. No literal
         colour, face or size belongs in this file — that is what keeps the HTML, Word and PDF
         exports of one conversation looking like one document. */
{{THEME}}

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: var(--page-bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--size-body);
        line-height: 1.55;
      }

      .document {
        max-width: 820px;
        margin: 0 auto;
        padding: 28px 32px 36px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .document__header {
        padding-bottom: 16px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .document__title {
        margin: 0;
        color: var(--brand);
        font-size: var(--size-title);
        font-weight: 700;
        line-height: 1.25;
      }

      .document__meta {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: var(--size-subtitle);
      }

      /* No rule between messages: the role label's own space is what separates them, which is all
         Word and PDF have to work with too. */
      .message {
        padding: 14px 0 2px;
      }

      /* The prompt is banded rather than bubbled: a right-aligned bubble does not survive page flow,
         and Word and PDF mark the same turn with the same tint and the same left rule. */
      .message--user {
        padding: 14px 16px 2px;
        margin-top: 14px;
        background: var(--user-band);
        border-left: 3px solid var(--brand);
        border-radius: 0 8px 8px 0;
      }

      .message__role {
        margin: 0 0 8px;
        color: var(--brand);
        font-size: var(--size-role);
        font-weight: 700;
      }

      .message__body > *:first-child {
        margin-top: 0;
      }

      .message__body p {
        margin: 8px 0 0;
      }

      .message__body h1,
      .message__body h2,
      .message__body h3,
      .message__body h4,
      .message__body h5,
      .message__body h6 {
        margin: 14px 0 0;
        color: var(--brand);
        font-weight: 700;
        line-height: 1.3;
      }

      .message__body h1 {
        font-size: var(--size-h1);
      }
      .message__body h2 {
        font-size: var(--size-h2);
      }
      .message__body h3 {
        font-size: var(--size-h3);
      }
      .message__body h4 {
        font-size: var(--size-h4);
      }
      .message__body h5 {
        font-size: var(--size-h5);
      }
      .message__body h6 {
        font-size: var(--size-h6);
      }

      .message__body ul,
      .message__body ol {
        margin: 8px 0 0;
        padding-left: 22px;
      }

      .message__body li {
        margin-top: 4px;
      }

      /* A rule and an indent, and no colour change: Word and PDF can draw the first two on every
         paragraph a quote holds, and cannot cascade the third into a heading or a fence inside it. */
      .message__body blockquote {
        margin: 10px 0 0;
        padding: 2px 0 2px 12px;
        border-left: 2px solid var(--border);
      }

      .message__body a {
        color: var(--link);
        text-decoration: underline;
      }

      .message__body hr {
        margin: 14px 0 0;
        border: 0;
        border-top: 1px solid var(--border);
      }

      .message__body table {
        width: 100%;
        margin: 12px 0 0;
        border-collapse: collapse;
        font-size: var(--size-cell);
      }

      .message__body th,
      .message__body td {
        padding: 6px 10px;
        border: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      .message__body th {
        background: var(--surface-alt);
        font-weight: 700;
      }

      .message__body code {
        padding: 0.1em 0.35em;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface-alt);
        font-family: var(--font-mono);
        font-size: var(--size-code);
      }

      /* Light rather than the app's dark code chrome, on purpose and in every format: these
         documents are printed, and a dark block is a page of toner. */
      .code {
        margin: 12px 0 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .code__lang {
        padding: 4px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-alt);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: var(--size-code-lang);
      }

      .code pre {
        margin: 0;
        padding: 10px 12px;
        background: var(--surface-alt);
        overflow-x: auto;
      }

      .code code {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        font-size: var(--size-code);
        line-height: 1.5;
      }

      @media print {
        body {
          padding: 0;
          background: var(--surface);
        }

        .document {
          max-width: none;
          padding: 0;
          border: 0;
          border-radius: 0;
        }

        .message,
        .code,
        .message__body table {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main class="document">
      <header class="document__header">
        <h1 class="document__title">{{TITLE}}</h1>
        <p class="document__meta">Exported {{DATE}}</p>
      </header>

      <div class="messages">{{MESSAGES}}</div>
    </main>
  </body>
</html>
