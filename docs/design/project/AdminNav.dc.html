<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
</helmet>
<div style="width:100%;display:flex;flex-direction:column;gap:2px;font-family:Inter,sans-serif">
  <div style="display:flex;align-items:center;gap:8px;padding:2px 10px 12px"><i class="bi bi-shield-lock" style="font-size:14px;color:var(--brand)"></i><span style="font-family:Montserrat,sans-serif;font-weight:700;font-size:15px;color:var(--bs-body-color)">Admin</span></div>
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="4">
    <div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;background:{{ n.bg }};color:{{ n.color }};font-weight:{{ n.fw }};font-size:13.5px;cursor:pointer" style-hover="background:var(--surface-2)">
      <i class="bi {{ n.i }}" style="font-size:14px;width:18px;text-align:center"></i><span>{{ n.l }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:190,&quot;height&quot;:260},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;users&quot;,&quot;models&quot;,&quot;mcp&quot;,&quot;reports&quot;],&quot;default&quot;:&quot;users&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'users';
    const items = [['users','bi-people','Users'],['models','bi-cpu','Models'],['mcp','bi-plug','MCP servers'],['reports','bi-graph-up','Reports']]
      .map(([k,i,l]) => ({ k, i, l,
        bg: k === active ? 'var(--active-bg)' : 'transparent',
        color: k === active ? 'var(--brand)' : 'var(--bs-body-color)',
        fw: k === active ? '600' : '500' }));
    return { items };
  }
}
</script>
</body>
</html>
