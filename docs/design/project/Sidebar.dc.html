<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
</helmet>
<div style="height:100%;width:100%;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--bs-border-color);font-family:Inter,sans-serif">
<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;height:100%;min-height:0">
  <div style="padding:16px 16px 0">
    <img src="assets/logo-full.png" alt="Andes Software Solutions" style="height:48px;display:var(--show-light)">
    <img src="assets/logo-full-dark.png" alt="Andes Software Solutions" style="height:48px;display:var(--show-dark)">
    <svg width="100%" height="10" viewBox="0 0 228 10" preserveAspectRatio="none" style="display:block;margin-top:12px"><path d="M0 8.5 L22 3 L38 7 L58 1.5 L76 8 L98 3.5 L116 7.5 L138 2 L158 7 L180 3 L202 7.5 L228 4" fill="none" style="stroke:var(--muted);opacity:.5" stroke-width="1.2" stroke-linejoin="round"></path></svg>
  </div>
  <div style="padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px">
    <button class="btn btn-primary" style="width:100%;height:40px;border-radius:10px;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px"><i class="bi bi-plus-lg"></i><span>New conversation</span></button>
    <div style="position:relative">
      <i class="bi bi-search" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted)"></i>
      <input class="form-control" placeholder="Search conversations" style="height:36px;border-radius:10px;padding-left:32px;font-size:13px;background:var(--surface-2);border-color:transparent;color:var(--bs-body-color);box-shadow:none">
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;background:{{ n.bg }};color:{{ n.color }};font-weight:{{ n.fw }};font-size:13.5px;cursor:pointer" style-hover="background:var(--surface-2)">
          <i class="bi {{ n.i }}" style="font-size:15px;width:18px;text-align:center"></i>
          <span style="flex:1">{{ n.l }}</span>
          <sc-if value="{{ n.shield }}" hint-placeholder-val="{{ false }}"><i class="bi bi-shield-lock" style="font-size:12px;color:var(--muted)"></i></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding:6px 12px 4px;border-top:1px solid var(--bs-border-color)">
    <div style="display:flex;align-items:center;gap:6px;padding:6px 10px 1px">
      <i class="bi bi-chevron-down" style="font-size:9px;color:var(--muted)"></i>
      <span style="font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)">Favorite projects</span>
    </div>
    <div style="font-size:11px;color:var(--muted);padding:0 10px 6px;opacity:.8">Pinned on this device — pins don&rsquo;t sync.</div>
    <div style="display:flex;flex-direction:column;gap:1px">
      <div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;cursor:pointer" style-hover="background:var(--surface-2)">
        <i class="bi bi-folder-fill" style="color:var(--brand);font-size:13px"></i>
        <span style="flex:1;font-size:13px;font-weight:500;color:var(--bs-body-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Data Platform Migration</span>
        <i class="bi bi-chevron-down" style="font-size:10px;color:var(--muted)"></i>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;padding-left:22px">
        <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;background:var(--active-bg)">
          <i class="bi bi-chat-left" style="font-size:11px;color:var(--brand)"></i>
          <span style="flex:1;font-size:12.5px;font-weight:600;color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Helios 2.4 release status</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;cursor:pointer" style-hover="background:var(--surface-2)">
          <i class="bi bi-chat-left" style="font-size:11px;color:var(--muted)"></i>
          <span style="flex:1;font-size:12.5px;color:var(--bs-body-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Warehouse sync failure triage</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;cursor:pointer" style-hover="background:var(--surface-2)">
        <i class="bi bi-folder-fill" style="color:var(--brand);font-size:13px"></i>
        <span style="flex:1;font-size:13px;font-weight:500;color:var(--bs-body-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">RFP Responses</span>
        <i class="bi bi-chevron-right" style="font-size:10px;color:var(--muted)"></i>
      </div>
    </div>
  </div>
  <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:2px 12px 6px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px">Conversations</div>
    <div style="flex:1;min-height:0;overflow-y:{{ convOverflow }};display:flex;flex-direction:column;gap:1px">
      <sc-for list="{{ convs }}" as="c" hint-placeholder-count="8">
        <div style="position:relative;display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;border-radius:8px;background:{{ c.bg }};cursor:pointer" style-hover="background:var(--surface-2)">
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:{{ c.fw }};color:var(--bs-body-color)">{{ c.t }}</span>
          <sc-if value="{{ c.fav }}" hint-placeholder-val="{{ false }}"><i class="bi bi-star-fill" style="font-size:10px;color:var(--accent)"></i></sc-if>
          <sc-if value="{{ c.hover }}" hint-placeholder-val="{{ false }}"><i class="bi bi-three-dots-vertical" style="font-size:13px;color:var(--muted)"></i></sc-if>
          <sc-if value="{{ c.menu }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:30px;right:6px;z-index:40;width:204px;background:var(--surface);border:1px solid var(--bs-border-color);border-radius:12px;box-shadow:0 10px 30px rgba(11,31,51,.22);padding:6px">
              <div style="display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:8px;font-size:13px;cursor:pointer" style-hover="background:var(--surface-2)"><i class="bi bi-pencil" style="font-size:13px;color:var(--muted)"></i>Rename</div>
              <div style="display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:8px;font-size:13px;cursor:pointer" style-hover="background:var(--surface-2)"><i class="bi bi-star" style="font-size:13px;color:var(--muted)"></i>Favorite</div>
              <div style="display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:8px;font-size:13px;cursor:pointer" style-hover="background:var(--surface-2)"><i class="bi bi-folder-symlink" style="font-size:13px;color:var(--muted)"></i>Move to project<i class="bi bi-chevron-right" style="margin-left:auto;font-size:11px;color:var(--muted)"></i></div>
              <div style="display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:8px;font-size:13px;cursor:pointer" style-hover="background:var(--surface-2)"><i class="bi bi-folder-minus" style="font-size:13px;color:var(--muted)"></i>Remove from project</div>
              <div style="height:1px;background:var(--bs-border-color);margin:5px 4px"></div>
              <div style="display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:8px;font-size:13px;color:var(--fail);cursor:pointer" style-hover="background:var(--surface-2)"><i class="bi bi-trash3" style="font-size:13px"></i>Delete</div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="border-top:1px solid var(--bs-border-color);padding:10px 12px;display:flex;align-items:center;gap:10px">
    <div style="width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--btnP-fg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 30px">SH</div>
    <div style="flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Sofía Herrera</div>
    <button style="width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--surface-2)"><i class="bi bi-moon" style="display:var(--show-light)"></i><i class="bi bi-sun" style="display:var(--show-dark)"></i></button>
    <button style="width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--surface-2)"><i class="bi bi-box-arrow-right"></i></button>
  </div>
</div>
</sc-if>
<sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:center;height:100%;padding:12px 0 10px;gap:7px">
  <img src="assets/logo-mark.png" alt="Andes" style="width:32px;display:var(--show-light)">
  <img src="assets/logo-mark-dark.png" alt="Andes" style="width:32px;display:var(--show-dark)">
  <button class="btn btn-primary" style="width:44px;height:44px;border-radius:10px;padding:0;font-size:16px;margin-top:4px"><i class="bi bi-plus-lg"></i></button>
  <button style="width:44px;height:44px;border:none;background:transparent;border-radius:10px;color:var(--muted);font-size:15px" style-hover="background:var(--surface-2)"><i class="bi bi-search"></i></button>
  <div style="width:32px;border-top:1px solid var(--bs-border-color);margin:2px 0"></div>
  <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
    <div style="position:relative;width:44px;height:44px;border-radius:10px;background:{{ n.bg }};color:{{ n.color }};display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer" style-hover="background:var(--surface-2)">
      <i class="bi {{ n.i }}"></i>
      <sc-if value="{{ n.tip }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:54px;top:50%;transform:translateY(-50%);background:#0B1F33;color:#FFFFFF;font-size:12px;font-weight:500;padding:5px 11px;border-radius:8px;white-space:nowrap;box-shadow:0 6px 16px rgba(11,31,51,.35);z-index:60">Conversations</div>
      </sc-if>
    </div>
  </sc-for>
  <div style="width:32px;border-top:1px solid var(--bs-border-color);margin:2px 0"></div>
  <div style="width:44px;height:44px;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer" style-hover="background:var(--surface-2)"><i class="bi bi-star"></i></div>
  <div style="flex:1"></div>
  <div style="width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--btnP-fg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">SH</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:900},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chat&quot;,&quot;conversations&quot;,&quot;projects&quot;,&quot;documents&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;chat&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kebabOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;},&quot;tooltip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const collapsed = p.collapsed ?? false;
    const active = p.active ?? 'chat';
    const kebabOpen = p.kebabOpen ?? false;
    const tooltip = p.tooltip ?? false;
    const navDef = [
      ['chat', 'bi-chat-square-text', 'Chat'],
      ['conversations', 'bi-clock-history', 'Conversations'],
      ['projects', 'bi-folder2', 'Projects'],
      ['documents', 'bi-file-earmark-text', 'Documents'],
      ['admin', 'bi-sliders', 'Admin', true]
    ];
    const nav = navDef.map(([k, i, l, shield]) => ({
      k, i, l, shield: !!shield,
      bg: k === active ? 'var(--active-bg)' : 'transparent',
      color: k === active ? 'var(--brand)' : 'var(--bs-body-color)',
      fw: k === active ? '600' : '500',
      tip: tooltip && k === 'conversations'
    }));
    const titles = [
      ['Helios 2.4 release status', true],
      ['Vendor SSO escalation email'],
      ['Warehouse sync failure triage'],
      ['Q3 roadmap talking points', true],
      ['Onboarding doc outline'],
      ['SQL for churn cohort analysis'],
      ['RACI — data platform team'],
      ['Translate release notes (ES)'],
      ['Incident 4411 postmortem draft']
    ];
    const convs = titles.map(([t, fav], i) => ({
      t, fav: !!fav,
      bg: i === 0 ? 'var(--active-bg)' : 'transparent',
      fw: i === 0 ? '600' : '400',
      hover: kebabOpen && i === 1,
      menu: kebabOpen && i === 1
    }));
    return { expanded: !collapsed, collapsed, nav, convs, convOverflow: kebabOpen ? 'visible' : 'auto' };
  }
}
</script>
</body>
</html>
